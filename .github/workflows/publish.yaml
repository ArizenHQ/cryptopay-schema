name: Publish CI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ArizenHQ'
          always-auth: true
      - run: npm install --global yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
