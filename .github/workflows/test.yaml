name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: jest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # The isolation tests run the models against a real DynamoDB.
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
